name: release

# Pushing a tag like v0.2.0 builds the binaries and publishes a release.
# The tag has to match the version in Cargo.toml, and CHANGELOG.md needs a
# "## 0.2.0" section, which becomes the release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml and CHANGELOG.md
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi
          if ! grep -q "^## $version\( \|$\)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

  build:
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Asset names carry no version, so releases/latest/download/... links
      # keep working.
      - name: Package
        run: |
          dir=upst-${GITHUB_REF_NAME#v}-${{ matrix.target }}
          mkdir -p "$dir/docs"
          cp target/${{ matrix.target }}/release/upst README.md CHANGELOG.md LICENSE "$dir/"
          cp -R contrib "$dir/"
          cp docs/setup.md "$dir/docs/"
          tar czf upst-${{ matrix.target }}.tar.gz "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: upst-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          awk -v v="${GITHUB_REF_NAME#v}" '/^## / { p = ($2 == v) } p' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "upst $GITHUB_REF_NAME" --notes-file notes.md
