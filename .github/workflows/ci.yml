name: ci

on:
  push:
  pull_request:

jobs:
  cargo:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # upst-core on its own, as a service like elamond builds it: the
  # oldest supported Rust, every feature set, and none of the UI's
  # dependencies.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p upst-core --locked
      - run: cargo build -p upst-core --locked --all-features
      - name: No UI dependencies
        run: |
          cargo tree -p upst-core --all-features -e normal --prefix none
          if cargo tree -p upst-core --all-features -e normal --prefix none | grep -E '^(ratatui|crossterm|clap|anyhow|toml|chrono) '; then
            echo "::error::upst-core pulls in a UI dependency"
            exit 1
          fi
      - run: cargo test -p upst-core --locked
      - run: cargo test -p upst-core --locked --all-features
      - run: cargo test -p upst-core --locked --all-features --doc
      - run: cargo doc -p upst-core --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The NixOS VM test needs KVM, which the runners have but do not open
      # to the build user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check -L
