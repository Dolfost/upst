[package]
name = "upst"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal dashboard for UPSes monitored by Network UPS Tools"
license = "Apache-2.0"
repository = "https://github.com/Dolfost/upst"
readme = "README.md"
keywords = ["ups", "nut", "tui", "monitoring", "power"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
